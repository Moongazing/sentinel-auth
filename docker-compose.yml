version: "3.9"

services:
  app:
    build: .
    container_name: sentinel-auth
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    environment:
      - PORT=8080
      - DB_DSN=host=db user=postgres password=secret dbname=sentinel port=5432 sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=super_secret_token
    restart: always

  db:
    image: postgres:15
    container_name: sentinel-postgres
    restart: always
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sentinel-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
